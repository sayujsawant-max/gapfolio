# Render blueprint: New + > Blueprint, point it at the repository.
# Runs on the FREE plan: the embedding model uses ~170 MB through ONNX Runtime,
# so the service fits the 512 MB limit. Free instances sleep after 15 minutes
# idle (the first visit then takes ~1 minute) and lose SQLite data on restart.
services:
  - type: web
    name: gapfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GAPFOLIO_SECRET_KEY
        generateValue: true
      - key: GAPFOLIO_EMBEDDING_PROVIDER
        value: onnx
      - key: GAPFOLIO_EMBEDDING_DIM
        value: "384"
      # Optional: set to turn on Claude-written explanations and roadmap text.
      - key: GAPFOLIO_ANTHROPIC_API_KEY
        sync: false
